<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sonic Web Launcher</title>
<style>
  body {
    margin: 0;
    background: #0a0f29;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
  }
  header {
    padding: 40px 0;
    font-size: 32px;
    font-weight: bold;
    color: #00d0ff;
    text-shadow: 1px 1px #000;
  }
  .grid {
    display: grid;
    gap: 18px;
    padding: 20px;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    max-width: 900px;
    margin: auto;
  }
  .card {
    background: #112169;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0px 4px 10px #000;
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
  }
  .card:hover {
    transform: scale(1.05);
    box-shadow: 0px 6px 14px #000;
  }
  .card h2 {
    margin: 0 0 8px;
    color: #ffd800;
    font-size: 22px;
  }
  .card p {
    font-size: 14px;
    color: #eee;
  }
  .card a {
    text-decoration: none;
    color: inherit;
  }
  footer {
    margin: 30px 0;
    font-size: 14px;
    color: #aaa;
  }
</style>
</head>
<body>

<header>
  🌀 Sonic Web Launcher 🌀
</header>

<div class="grid">

  <a class="card" href="https://aaravohi.github.io/Sonic-1-WASM-WEB/" target="_blank">
    <h2>Sonic the Hedgehog (1)</h2>
    <p>Play the classic Sonic 1 in your browser.</p>
  </a>

  <a class="card" href="https://aaravohi.github.io/Sonic-2-WASM-WEB/" target="_blank">
    <h2>Sonic the Hedgehog 2</h2>
    <p>Play Sonic 2 (Genesis) online.</p>
  </a>

  <a class="card" href="https://burnedpopcorn.github.io/sonic3air-webport/sonic3air-v20240202-r2/sonic3air_web.html" target="_blank">
    <h2>Sonic 3 A.I.R.</h2>
    <p>Launch the fan-made Air remake in web form.</p>
  </a>

  <a class="card" href="https://tws2401.github.io/Sonic-CD-WASM/" target="_blank">
    <h2>Sonic CD (WASM)</h2>
    <p>Classic Sonic CD in the browser.</p>
  </a>

</div>

<footer>
  <p>Sonic Web Launcher by BogHog11</p>
</footer>

</body>
</html>
